org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ===== Python для Chaquopy =====
# Пусто = определить автоматически по тому, что установлено на компьютере
# (скрипт сборки смотрит вывод `py -0p`). Если хотите зафиксировать версию —
# напишите её здесь: pythonVersion=3.13
#
# ВАЖНО: локальный Python на компьютере и Python в приложении должны совпадать
# по major.minor — Chaquopy запускает локальный pip при сборке.
pythonVersion=

# ===== 32-битные телефоны (armeabi-v7a) =====
# false (по умолчанию) = один APK под 64-битные устройства (arm64-v8a).
# true  = два продуктовых варианта и два APK за одну сборку:
#           app-arm64-*.apk — 64-битные устройства (versionCode 223)
#           app-arm32-*.apk — 32-битные устройства (versionCode 222)
#         в каждом лежит только свой рантайм Python, поэтому APK не «толстеют».
#
# ВАЖНО: 32-битный Python у Chaquopy есть только для версий 3.11 и старше,
# поэтому при abi32=true Python приложения автоматически переключается на 3.11 —
# и на компьютере для сборки тоже нужен Python 3.11 (Chaquopy запускает локальный
# pip той же версии). Разово, без правки этого файла: -Pabi32=true
abi32=false

# Для эмулятора добавьте x86_64: соберите с -Pemulator=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
